# FieldLab — self-host with Docker Compose
#
#   docker compose up -d
#   → http://your-server:8080
#
# All data (workspace, user accounts, sessions) persists in the named
# volume "fieldlab-data". Back it up with:
#   docker run --rm -v fieldlab-data:/d -v $PWD:/backup alpine \
#     tar czf /backup/fieldlab-backup.tgz -C /d .

services:
  fieldlab:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - fieldlab-data:/app/data

volumes:
  fieldlab-data:
