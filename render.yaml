# Render.com blueprint for FieldLab — see docs/DEPLOY.md
# Note: the persistent disk requires a paid instance type (Starter);
# free web services have ephemeral disks and would lose data on redeploy.
services:
  - type: web
    name: fieldlab
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
    disk:
      name: fieldlab-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
